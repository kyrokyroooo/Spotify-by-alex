<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Spotify by Alex</title>
<style>
:root{--green:#1ed760;--bg:#000;--card:#1f1f1f;--tile:#2a2a2a;--sub:#b3b3b3;--accent:#3a3a3a;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Inter",Roboto,Arial,sans-serif;overscroll-behavior:none;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
svg{display:block;fill:currentColor}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:var(--sat);padding-bottom:calc(150px + var(--sab))}
#view::-webkit-scrollbar,.hs::-webkit-scrollbar,#lyrics::-webkit-scrollbar,#playerScroll::-webkit-scrollbar{display:none}
.pad{padding:0 16px}
/* Home */
.homeTop{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;position:sticky;top:0;z-index:5;background:linear-gradient(#000 70%,transparent)}
.avatar{width:34px;height:34px;border-radius:50%;background:#e8a2ff;color:#000;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--tile);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.chip.on{background:var(--green);color:#000}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 16px 4px}
.qtile{display:flex;align-items:center;gap:0;background:var(--tile);border-radius:4px;height:56px;overflow:hidden;text-align:left}
.qtile img{width:56px;height:56px;object-fit:cover;flex-shrink:0}
.qtile span{font-size:12.5px;font-weight:700;padding:0 8px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
h2.sec{font-size:22px;font-weight:800;letter-spacing:-.3px;padding:22px 16px 12px}
.hs{display:flex;gap:14px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.card{flex:0 0 142px;text-align:left}
.card img{width:142px;height:142px;object-fit:cover;border-radius:4px;display:block;background:var(--tile)}
.card b{display:block;font-size:14px;margin-top:8px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--sub);font-size:12.5px;margin-top:3px;line-height:1.3}
.art{flex:0 0 112px;text-align:center}
.art img{width:112px;height:112px;border-radius:50%;object-fit:cover;display:block}
.art b{display:block;font-size:13px;margin-top:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art small{color:var(--sub);font-size:12px}
/* Page header (playlist) */
.plHead{padding:calc(8px) 16px 0;background:linear-gradient(var(--hc,#444) 0%,#000 100%);background-size:100% 380px;background-repeat:no-repeat}
.back{width:40px;height:40px;display:flex;align-items:center;justify-content:flex-start;margin-left:-6px}
.plCover{width:62%;max-width:240px;aspect-ratio:1;margin:6px auto 18px;display:block;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.5);object-fit:cover}
.plTitle{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.plDesc{color:var(--sub);font-size:13px;margin-top:6px;line-height:1.35}
.plMeta{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:8px;color:var(--sub)}
.plMeta .avatar{width:22px;height:22px;font-size:11px}
.plCtl{display:flex;align-items:center;gap:20px;padding:14px 0}
.plCtl .sp{flex:1}
.bigPlay{width:56px;height:56px;border-radius:50%;background:var(--green);color:#000;display:flex;align-items:center;justify-content:center}
.ic{width:26px;height:26px;color:var(--sub)}
.ic.on{color:var(--green)}
/* Rows */
.row{display:flex;align-items:center;gap:12px;padding:6px 16px;min-height:62px}
.row .rm{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.row img{width:48px;height:48px;object-fit:cover;border-radius:3px;background:var(--tile);flex-shrink:0}
.row .t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-size:13.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.cur .t{color:var(--green)}
.dots{width:36px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--sub);flex-shrink:0}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-right:6px;vertical-align:-1px}
.eq i{width:2.5px;background:var(--green);animation:eq 0.9s infinite ease-in-out;border-radius:1px}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}
.paused .eq i{animation-play-state:paused}
/* Search */
.hTitle{font-size:28px;font-weight:800;letter-spacing:-.5px;padding:14px 16px 10px}
.sbox{margin:0 16px;position:relative}
.sbox input{width:100%;height:44px;border-radius:6px;border:0;outline:0;background:#fff;color:#000;font-size:15px;font-weight:500;padding:0 38px 0 40px}
.sbox input::placeholder{color:#555}
.sbox svg.s{position:absolute;left:11px;top:10px;width:24px;height:24px;color:#000}
.sbox button{position:absolute;right:8px;top:6px;width:32px;height:32px;color:#000;font-size:18px}
.gGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.gTile{position:relative;height:98px;border-radius:8px;overflow:hidden;text-align:left;padding:12px;font-weight:800;font-size:17px;line-height:1.15}
.gTile img{position:absolute;right:-12px;bottom:-4px;width:68px;height:68px;transform:rotate(25deg);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.msg{color:var(--sub);text-align:center;font-size:14px;padding:36px 24px;line-height:1.5}
/* Library */
.libHead{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.libHead h1{font-size:22px;font-weight:800;flex:1}
.libItem{display:flex;align-items:center;gap:12px;padding:8px 16px;width:100%;text-align:left}
.libItem img,.libItem .ph{width:56px;height:56px;border-radius:4px;object-fit:cover;flex-shrink:0}
.libItem .ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4500e2,#a79df0);color:#fff}
.libItem b{display:block;font-size:16px;font-weight:600}
.libItem small{color:var(--sub);font-size:13.5px}
/* Mini player */
#mini{position:fixed;left:8px;right:8px;bottom:calc(52px + var(--sab));z-index:20;display:none;background:var(--accent);border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.5);overflow:hidden;transition:background .4s}
#mini .mr{display:flex;align-items:center;gap:10px;padding:7px 8px;height:56px}
#mini img{width:40px;height:40px;border-radius:4px;object-fit:cover;flex-shrink:0}
#mini .mt{flex:1;min-width:0;text-align:left}
#mini .mt b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mt small{display:block;font-size:12.5px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#mini .mb{width:38px;height:38px;display:flex;align-items:center;justify-content:center}
#miniBar{height:2px;background:rgba(255,255,255,.25);margin:0 8px 0}
#miniBar i{display:block;height:100%;width:0;background:#fff}
/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 0 calc(4px + var(--sab));background:linear-gradient(transparent,rgba(0,0,0,.92) 28%,#000 60%)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;white-space:nowrap;font-weight:500;color:var(--sub);padding-top:6px;min-height:46px}
.tab svg{width:26px;height:26px}
.tab.on{color:#fff}
/* Full player */
#player{position:fixed;inset:0;z-index:40;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);background:linear-gradient(var(--accent) 0%,#121212 78%);display:flex;flex-direction:column;padding-top:var(--sat)}
#player.open{transform:none}
#playerScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 24px calc(28px + var(--sab))}
.pTop{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;flex-shrink:0}
.pTop .c{text-align:center;min-width:0;flex:1;padding:0 6px}
.pTop .c small{display:block;font-size:11px;letter-spacing:.2px;color:rgba(255,255,255,.75);font-weight:500}
.pTop .c b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pTop button{width:42px;height:42px;display:flex;align-items:center;justify-content:center}
#fullCover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);margin-top:14px;background:var(--tile)}
.pInfo{display:flex;align-items:center;gap:14px;margin-top:26px}
.pInfo .tx{flex:1;min-width:0}
.pInfo h3{font-size:22px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pInfo p{font-size:16px;color:rgba(255,255,255,.7);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pInfo button{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
#seek{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin-top:18px;display:block;outline:0}
#seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,#fff var(--p,0%),rgba(255,255,255,.3) var(--p,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;margin-top:-4.5px}
#seek::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
#seek::-moz-range-progress{height:4px;border-radius:2px;background:#fff}
#seek::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.7);margin-top:2px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ctl button{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#fff}
.ctl .big{width:68px;height:68px;border-radius:50%;background:#fff;color:#000}
.ctl .sm{color:rgba(255,255,255,.8)}
.ctl .sm.on{color:var(--green)}
.pBottom{display:flex;justify-content:space-between;margin-top:8px;padding:0 4px}
.pBottom button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8)}
.lyCard{margin-top:22px;border-radius:12px;background:var(--accent);background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12));overflow:hidden}
.lyHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;font-weight:800;font-size:15px}
.lyHead span{font-size:11px;font-weight:600;background:rgba(0,0,0,.28);padding:3px 9px;border-radius:99px}
#lyrics{position:relative;max-height:290px;overflow-y:auto;padding:10px 16px 18px;scroll-behavior:smooth}
.ly{font-size:22px;line-height:1.28;font-weight:800;letter-spacing:-.3px;color:rgba(0,0,0,.55);padding:7px 0;transition:color .25s,transform .25s;transform-origin:left;cursor:pointer}
.ly.past{color:rgba(255,255,255,.55)}
.ly.now{color:#fff}
.ly.plain{color:#fff;font-size:17px;font-weight:700;cursor:default;padding:4px 0}
.lyMsg{font-size:14px;color:rgba(255,255,255,.8);padding:8px 0}
/* Sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.6);align-items:flex-end}
#sheet.open{display:flex}
#sheetBody{width:100%;max-height:82dvh;overflow-y:auto;background:#282828;border-radius:14px 14px 0 0;padding:14px 0 calc(18px + var(--sab));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.shHead{display:flex;align-items:center;gap:12px;padding:6px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:6px}
.shHead img{width:52px;height:52px;border-radius:4px;object-fit:cover}
.shHead b{display:block;font-size:16px}
.shHead small{color:var(--sub);font-size:13.5px}
.shItem{display:flex;align-items:center;gap:16px;width:100%;padding:13px 18px;font-size:16px;text-align:left}
.shItem svg{width:24px;height:24px;color:var(--sub)}
.shItem.on svg{color:var(--green)}
.shIn{display:flex;gap:8px;padding:10px 18px}
.shIn input{flex:1;height:44px;border-radius:6px;border:0;outline:0;background:#3e3e3e;color:#fff;padding:0 12px;font-size:15px}
.shIn button,.pill{background:var(--green);color:#000;font-weight:700;border-radius:99px;padding:0 20px;height:44px;font-size:14px}
.shTitle{font-size:18px;font-weight:800;padding:4px 18px 10px}
.note{color:var(--sub);font-size:12.5px;line-height:1.5;padding:4px 18px 10px}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 14px);transform:translateX(-50%);z-index:80;background:#fff;color:#000;font-weight:700;font-size:13px;padding:10px 16px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5);display:none;max-width:88vw;text-align:center}
#view .row.na{opacity:.4}
#ytWrap{position:fixed;left:-500px;top:0;width:200px;height:200px;overflow:hidden;opacity:.01;pointer-events:none}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mos{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;background:var(--tile)}
.mos.one{grid-template-columns:1fr}
.mos.one img:nth-child(n+2){display:none}
.mos img{width:100%!important;height:100%!important;border-radius:0!important;aspect-ratio:1;object-fit:cover;display:block}
.card .mos{width:142px;height:142px;border-radius:4px}
.qtile .mos{width:56px;height:56px;flex-shrink:0}
.libItem .mos{width:56px;height:56px;border-radius:4px;flex-shrink:0}
.plCover.mos{display:grid}
.card.sq img{border-radius:4px}
.tab.dim{opacity:.85}
.spHero{text-align:center;padding:26px 24px 8px}
.spHeart{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1ed760,#0e8a3b)}
.spHero h1{font-size:26px;font-weight:800;letter-spacing:-.4px}
.spHero p{color:var(--sub);font-size:14px;line-height:1.5;margin-top:8px}
.spCard{margin:18px 24px 0;background:#fff;color:#111;border-radius:18px;padding:16px 16px 14px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.spTop{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.spTop b{font-size:18px;letter-spacing:.5px;color:#d9202a}
.spTop span{font-size:11.5px;color:#666}
.spQr{width:100%;max-width:290px;aspect-ratio:1;display:block;margin:0 auto;image-rendering:pixelated}
.spName{font-weight:800;font-size:16px;margin-top:8px}
.spNm{font-size:12px;color:#666;margin-top:2px}
.spBtns{display:flex;gap:10px;justify-content:center;margin:16px 24px 0}
.spBtn{flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none;line-height:1}
.spBtn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px #777}
.spSteps{margin:20px 24px 0;display:flex;flex-direction:column;gap:12px;font-size:13.5px;color:#ddd;line-height:1.45}
.spSteps div{display:flex;gap:12px;align-items:flex-start}
.spSteps i{flex:0 0 24px;height:24px;border-radius:50%;background:#2a2a2a;color:var(--green);font-style:normal;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.card.sm{flex:0 0 108px}
.card.sm img{width:108px;height:108px}
.card.sm b{font-size:12.5px;margin-top:6px}
.card.sm small{font-size:11.5px}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<audio id="audio" preload="auto" playsinline></audio>
<input id="fileIn" type="file" accept="audio/*" multiple hidden />

<div id="mini">
  <div class="mr">
    <img id="miniCover" alt="" data-act="openPlayer" />
    <div class="mt" data-act="openPlayer"><b id="miniTitle"></b><small id="miniArtist"></small></div>
    <button class="mb" data-act="favCur" id="miniFav"></button>
    <button class="mb" data-act="toggle" id="miniPlay"></button>
  </div>
  <div id="miniBar"><i id="miniFill"></i></div>
</div>

<nav id="tabs">
  <button class="tab on" data-act="tab" data-tab="home" id="tab-home"></button>
  <button class="tab" data-act="tab" data-tab="search" id="tab-search"></button>
  <button class="tab" data-act="tab" data-tab="library" id="tab-library"></button>
  <button class="tab" data-act="tab" data-tab="support" id="tab-support"></button>
  <button class="tab dim" data-act="newPl" id="tab-create"></button>
</nav>

<section id="player">
  <div class="pTop">
    <button data-act="closePlayer" id="pDown"></button>
    <div class="c"><small>Memutar dari</small><b id="pFrom">Spotify by Alex</b></div>
    <button data-act="menuCur" id="pMore"></button>
  </div>
  <div id="playerScroll">
    <img id="fullCover" alt="" />
    <div class="pInfo">
      <div class="tx"><h3 id="fullTitle">—</h3><p id="fullArtist">—</p></div>
      <button data-act="favCur" id="fullFav"></button>
    </div>
    <input id="seek" type="range" min="0" max="1000" value="0" />
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div class="ctl">
      <button class="sm" data-act="shuffle" id="bShuffle"></button>
      <button data-act="prev" id="bPrev"></button>
      <button class="big" data-act="toggle" id="bPlay"></button>
      <button data-act="next" id="bNext"></button>
      <button class="sm" data-act="repeat" id="bRepeat"></button>
    </div>
    <div class="pBottom">
      <button data-act="share" id="bShare"></button>
      <button data-act="queue" id="bQueue"></button>
    </div>
    <div class="lyCard">
      <div class="lyHead">Lirik <span id="lyBadge">—</span></div>
      <div id="lyrics"><p class="lyMsg">Putar lagu untuk melihat lirik.</p></div>
    </div>
  </div>
</section>

<div id="sheet" data-act="sheetBg"><div id="sheetBody"></div></div>
<div id="ytWrap"><div id="ytHost"></div></div>
<div id="toast"></div>

<script>
/* ============================================================
   UTIL
============================================================ */
const $=s=>document.querySelector(s);
const enc=encodeURIComponent;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,f){try{const r=localStorage.getItem(k);return r?JSON.parse(r):f}catch(_){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const fmt=sec=>{sec=Math.max(0,Math.floor(Number(sec)||0));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')};
const coreTitle=t=>String(t||'').toLowerCase().replace(/\([^)]*\)/g,'').replace(/\[[^\]]*\]/g,'').replace(/ - .*$/,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
let toastT;

  const key=o.key||(nrm(o.title)+'__'+nrm(String(o.artist).split(',')[0]));
  let t=TRACKS.get(key);
  if(!t){t={key,title:o.title,artist:o.artist,album:o.album||'',cover:o.cover||'',duration:o.duration||0,metaDone:!!(o.cover&&o.duration),local:!!o.local,url:o.url||''};TRACKS.set(key,t)}

  return t;
}

let metaCache=store.get('sba_meta4',{});
let active=0;const waiting=[];
function pump(){while(active<6&&waiting.length)waiting.shift()()}
function limited(fn,front){return new Promise(res=>{const job=async()=>{active++;try{res(await fn())}catch(_){res(null)}finally{active--;pump()}};front?waiting.unshift(job):waiting.push(job);pump()})}
const BAD_RE=/(sped\s?up|speed\s?up|slowed|reverb|nightcore|8d|karaoke|instrumental|mashup|ai\s?cover|ai[- ]generated|suno|udio|tribute|made famous|originally performed|type beat)/i;
function pickItunes(results,t){
  const tt=coreTitle(t.title),ta=nrm(String(t.artist).split(',')[0]).replace(/_/g,'');
  const wantsVariant=/remix|live|cover|acoustic/i.test(t.title);
  let best=null;
  for(const r of results){
    if(!r.trackName||!r.artistName)continue;
    if(BAD_RE.test(r.trackName+' '+r.artistName))continue;
    if(!wantsVariant&&/\b(live|karaoke)\b/i.test(r.trackName))continue;
    const rt=coreTitle(r.trackName),ra=nrm(r.artistName).replace(/_/g,'');
    const titleOK=rt===tt||(tt.length>3&&(rt.startsWith(tt)||tt.startsWith(rt)));
    const artistOK=ra.includes(ta)||ta.includes(ra)||ta.slice(0,5)===ra.slice(0,5);
    if(titleOK&&artistOK){if(rt===tt){return r}if(!best)best=r}
  }
  return best;
}
async function itunesLookup(t){
  const q=`${t.title} ${String(t.artist).split(',')[0]}`;
  for(const cc of ['ID','US']){
    try{
      const r=await fetch(`https://itunes.apple.com/search?term=${enc(q)}&media=music&entity=song&limit=12&country=${cc}`);
      if(!r.ok)continue;
      const j=await r.json();
      const m=pickItunes(j.results||[],t);
      if(m)return m;
    }catch(_){}
  }
  return null;
}
function applyMeta(t,m){
  if(m.cover)t.cover=m.cover;
  if(m.duration)t.duration=m.duration;
  if(m.album)t.album=m.album;
  if(m.preview)t.preview=m.preview;
  t.metaDone=true;scheduleMos();
  document.querySelectorAll(`[data-cv="${t.key}"]`).forEach(i=>{i.src=coverOf(t)});
  document.querySelectorAll(`[data-du="${t.key}"]`).forEach(i=>{i.textContent=fmt(t.duration)});
  if(S.cur&&S.cur.key===t.key)updatePlayerUI();
}
function jsonp(url,ms=8000){return new Promise(res=>{const cb='dz'+Math.random().toString(36).slice(2);const s=document.createElement('script');let done=false;const fin=d=>{if(done)return;done=true;clearTimeout(to);try{delete window[cb]}catch(_){window[cb]=undefined}s.remove();res(d)};const to=setTimeout(()=>fin(null),ms);window[cb]=d=>fin(d);s.onerror=()=>fin(null);s.src=url+(url.includes('?')?'&':'?')+'output=jsonp&callback='+cb;document.head.appendChild(s)})}
function pickDz(list,t){
  const tt=coreTitle(t.title),ta=nrm(String(t.artist).split(',')[0]).replace(/_/g,'');let best=null;
  for(const r of list){
    if(!r.title||!r.artist)continue;
    if(BAD_RE.test(r.title+' '+r.artist.name))continue;
    const rt=coreTitle(r.title_short||r.title),ra=nrm(r.artist.name).replace(/_/g,'');
    const tOK=rt===tt||(tt.length>3&&(rt.startsWith(tt)||tt.startsWith(rt)));
    const aOK=ra.includes(ta)||ta.includes(ra);
    if(tOK&&aOK){if(rt===tt)return r;if(!best)best=r}
  }

}
async function dzLookup(t){const d=await jsonp(`https://api.deezer.com/search?q=${enc(String(t.artist).split(',')[0]+' '+t.title)}&limit=15`);return d&&d.data?pickDz(d.data,t):null}
const metaInflight={};
function ensureMeta(t,front){
  if(t.metaDone||t.local)return Promise.resolve(t);
  if(metaCache[t.key]){applyMeta(t,metaCache[t.key]);return Promise.resolve(t)}
  if(metaInflight[t.key])return metaInflight[t.key];
  return metaInflight[t.key]=limited(async()=>{
    const r=await itunesLookup(t);
    if(r){
      const m={cover:(r.artworkUrl100||r.artworkUrl60||'').replace(/\d+x\d+bb/,'600x600bb'),duration:Math.round((r.trackTimeMillis||0)/1000),album:r.collectionName||'',preview:r.previewUrl||''};
      metaCache[t.key]=m;store.set('sba_meta4',metaCache);applyMeta(t,m);

   AUDIO PENUH — Audius (tanpa API key). TIDAK ada fallback preview 30 detik.

const AUDIUS=['https://api.audius.co','https://discoveryprovider.audius.co','https://discoveryprovider2.audius.co','https://audius-discovery-1.cultur3stake.com'];
fetch('https://api.audius.co').then(r=>r.json()).then(j=>{if(j&&Array.isArray(j.data)){j.data.filter(x=>typeof x==='string'&&!AUDIUS.includes(x)).slice(0,4).forEach(x=>AUDIUS.push(x))}}).catch(()=>{});
let audCache=store.get('sba_aud2',{});
let nodeIdx=0;
const AUD_BAD=/(sped\s?up|speed\s?up|slowed|reverb|nightcore|8d|karaoke|instrumental|mashup|\bcover\b|ai\s?cover|ai[- ]generated|suno|udio|type beat|remix|jedag|koplo|funkot|breakbeat|hardstyle|y2meta|ytmp3|savefrom|mp3juices|downloader|indonesia raya)/i;
function audioUrl(t,k){const a=t._aud;return `${AUDIUS[(a.h+k)%AUDIUS.length]}/v1/tracks/${encodeURIComponent(a.id)}/stream?app_name=SpotifyByAlex`}
function markAvail(t,ok){
  t.avail=ok;
  document.querySelectorAll(`.row[data-key="${t.key}"]`).forEach(r=>{
    r.classList.toggle('na',!ok);
    const a=r.querySelector('.a');if(a)a.textContent=t.artist+(ok?'':' · audio penuh tidak tersedia');
  });
}
const audInflight={};
function resolveAudius(t){
  if(t.local)return Promise.resolve({});
  const c=audCache[t.key];
  if(c){t._aud=c;markAvail(t,true);return Promise.resolve(c)}
  if(c===0){markAvail(t,false);return Promise.resolve(null)}
  if(audInflight[t.key])return audInflight[t.key];
  return audInflight[t.key]=(async()=>{
    await ensureMeta(t,true);
    const artist=String(t.artist).split(',')[0].trim(),tt=coreTitle(t.title),ta=nrm(artist).replace(/_/g,'');
    const wants=/remix|live|cover|acoustic|sped|slowed/i.test(t.title);
    const D=t.duration||0;
    let reached=false,found=null;
    for(const q of [`${t.title} ${artist}`,t.title]){
      for(let k=0;k<AUDIUS.length;k++){
        const h=(nodeIdx+k)%AUDIUS.length;
        let data=null;
        try{
          const r=await fetch(`${AUDIUS[h]}/v1/tracks/search?query=${enc(q)}&limit=20&app_name=SpotifyByAlex`);
          if(!r.ok)continue;
          const j=await r.json();data=Array.isArray(j.data)?j.data:[];
        }catch(_){continue}
        reached=true;nodeIdx=h;
        let pool=data.filter(x=>{
          if(!x||!x.id||x.is_streamable===false)return false;
          if(!x.duration||x.duration<85||x.duration>700)return false;
          const up=String((x.user&&x.user.name)||''),ti=String(x.title||'');
          if(!wants&&AUD_BAD.test(up+' '+ti))return false;
          const cc=coreTitle(ti);
          if(cc.length<2||!(cc===tt||cc.includes(tt)||tt.includes(cc)))return false;
          const inText=nrm(up+' '+ti).replace(/_/g,'').includes(ta);
          if(D){if(Math.abs(x.duration-D)>(inText?25:14))return false}
          else if(!inText)return false;
          return true;
        });
        pool.sort((a,b)=>{
          const sa=(nrm(String((a.user&&a.user.name)||'')+' '+a.title).replace(/_/g,'').includes(ta)?5:0)+Math.log10((a.play_count||0)+1);
          const sb=(nrm(String((b.user&&b.user.name)||'')+' '+b.title).replace(/_/g,'').includes(ta)?5:0)+Math.log10((b.play_count||0)+1);
          return sb-sa;
        });
        if(pool.length)found={id:String(pool[0].id),h};
        break;
      }
      if(found)break;
    }
    delete audInflight[t.key];
    t._why=reached?'none':'net';
    if(found){audCache[t.key]=found;store.set('sba_aud2',audCache);t._aud=found;markAvail(t,true);return found}
    if(reached){audCache[t.key]=0;store.set('sba_aud2',audCache);markAvail(t,false)}
    return null;
  })();
}
function noAudio(t){

   YOUTUBE — audio penuh (embed resmi). Durasi iTunes dipakai untuk memilih versi asli.

let ytCache=store.get('sba_yt4',{}),lastYtErr='';
function isoDur(s){const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s||'');return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0}
async function fj(u,ms=8000){const c=new AbortController();const to=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok){lastYtErr='HTTP '+r.status;try{const j=await r.json();if(j&&j.error&&j.error.message)lastYtErr=j.error.message}catch(_){}return null}return await r.json()}catch(e){lastYtErr='koneksi gagal';return null}finally{clearTimeout(to)}}
async function ytSearch(q){
  const j=await fj(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoEmbeddable=true&maxResults=10&q=${enc(q)}&key=${enc(S.ytKey)}`);
  if(!j||!Array.isArray(j.items)||!j.items.length)return [];
  const ids=j.items.map(i=>i.id&&i.id.videoId).filter(Boolean).join(',');
  const d=await fj(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,statistics&id=${ids}&key=${enc(S.ytKey)}`);
  const map={};(d&&d.items||[]).forEach(v=>map[v.id]={dur:isoDur(v.contentDetails.duration),views:+(v.statistics&&v.statistics.viewCount)||0});
  return j.items.filter(i=>i.id&&i.id.videoId&&map[i.id.videoId]).map(i=>({id:i.id.videoId,title:i.snippet.title,channel:i.snippet.channelTitle,duration:map[i.id.videoId].dur,views:map[i.id.videoId].views}));
}
const YT_BAD=/(sped\s?up|speed\s?up|slowed|reverb|nightcore|8d|karaoke|instrumental|mashup|\bcover\b|ai\s?cover|ai[- ]generated|suno|udio|reaction|tutorial|chords|tribute|piano version|\blive\b|remix|bass boosted|lofi|lo-fi|1 hour|jedag|koplo|\bdj\b|full album|playlist|lyrics? video)/i;
function rankYt(items,t,loose){
  const D=t.duration||0,ta=nrm(String(t.artist).split(',')[0]).replace(/_/g,''),tt=coreTitle(t.title);
  const wants=/remix|live|cover|acoustic|sped|slowed/i.test(t.title);
  let pool=items.filter(c=>c.id&&c.duration>85&&c.duration<900);
  if(!wants)pool=pool.filter(c=>!YT_BAD.test(c.title)&&!/cover/i.test(c.channel));
  const tols=loose?[8,15,30,60]:[8,15,30];if(D){for(const tol of tols){const f=pool.filter(c=>Math.abs(c.duration-D)<=tol);if(f.length){pool=f;break}if(tol===tols[tols.length-1])pool=[]}}
  const sc=c=>{const ch=nrm(c.channel).replace(/_/g,''),ti=coreTitle(c.title);let s=0;
    if(/topic$/i.test(c.channel))s+=6;if(ch.includes(ta)||ta.includes(ch))s+=5;if(ti.includes(tt))s+=3;
    if(/official/i.test(c.title+c.channel))s+=2;if(/vevo/i.test(c.channel))s+=2;
    s+=Math.min(3,Math.log10((c.views||1)+1)/3);return s};
  return pool.map(c=>({c,s:sc(c)})).filter(x=>x.s>=(loose?1:3)).sort((a,b)=>b.s-a.s).map(x=>x.c);
}
async function resolveYt(t){
  if(ytCache[t.key]&&ytCache[t.key].length)return ytCache[t.key];
  await ensureMeta(t,true);
  const artist=String(t.artist).split(',')[0];
  const items=await ytSearch(`${artist} ${t.title}`);
  let ranked=rankYt(items,t);
  if(!ranked.length)ranked=rankYt(items,t,true);
  if(!ranked.length&&items.length&&!lastYtErr.startsWith('HTTP 4')){const i2=await ytSearch(`${artist} - ${t.title} official audio`);ranked=rankYt(i2,t);if(!ranked.length)ranked=rankYt(i2,t,true)}
  const ids=ranked.slice(0,5).map(x=>x.id);
  if(ids.length){ytCache[t.key]=ids;store.set('sba_yt4',ytCache)}
  return ids;
}

function getList(id){
  if(id==='fav')return S.favs;
  if(id==='recent')return S.recent;
  if(id.startsWith('rec:'))return (RC[id.slice(4)]||{}).tracks||[];
  if(id==='local')return S.local;
  if(id==='search')return S.search.res;
  if(id==='queue')return S.queue;
  if(id.startsWith('pl:'))return (PL[id.slice(3)]||{}).tracks||[];
  if(id.startsWith('up:'))return (S.userPl[+id.slice(3)]||{}).tracks||[];
  return [];
}
function listName(id){
  if(id==='fav')return 'Lagu yang Disukai';
  if(id==='recent')return 'Terakhir diputar';
  if(id.startsWith('rec:'))return (RC[id.slice(4)]||{}).name||'';
  if(id==='local')return 'File dari HP';
  if(id==='search')return 'Hasil pencarian';
  if(id.startsWith('pl:'))return (PL[id.slice(3)]||{}).name||'';
  if(id.startsWith('up:'))return (S.userPl[+id.slice(3)]||{}).name||'';
  return 'Spotify by Alex';
}

function playList(listId,i,shuffleStart){
  const l=getList(listId);if(!l.length)return;
  S.queue=[...l];S.from=listName(listId);
  if(shuffleStart)i=Math.floor(Math.random()*l.length);
  startAt(i);
}
async function startAt(i){
  if(!S.queue.length)return;
  const n=S.queue.length;S.qi=((i%n)+n)%n;
  const t=S.queue[S.qi];S.cur=t;S.token=(S.token||0)+1;const tk=S.token;
  if(S.from!=='Terakhir diputar'){S.recent=[t,...S.recent.filter(x=>x.key!==t.key)].slice(0,12);store.set('sba_rec1',S.recent.map(slim))}
  S.playing=false;S.loading=true;
  updatePlayerUI();fetchLyrics(t);refreshRows();
  audio.pause();t._prev=false;t._why='';
  try{ytPlayer&&ytPlayer.pauseVideo&&ytPlayer.pauseVideo()}catch(_){}
  if(t.local){S.mode='audio';audio.src=t.url;audio.play().catch(()=>{});return}
  if(S.ytKey&&!String(t.key).startsWith('au_')){
    const ids=await resolveYt(t);
    if(tk!==S.token)return;
    if(ids.length){t._ci=0;loadVideo(ids[0]);
      setTimeout(()=>{if(tk===S.token&&S.mode==='yt'&&S.loading&&!S.playing){try{const st=ytPlayer.getPlayerState();if(st!==1&&st!==3){S.loading=false;setPlayUI();toast('Ketuk ▶ untuk memutar')}}catch(_){}}},9000);
      return}
  }
  const a=await resolveAudius(t);
  if(tk!==S.token)return;
  if(!a){t._why=S.ytKey?'yt':t._why;noAudio(t);return}
  S.mode='audio';t._aud=a;t._try=0;
  audio.src=audioUrl(t,0);audio.load();audio.play().catch(()=>{});
}
function toggle(){
  if(!S.cur)return;
  if(S.playing)eng.pause();else eng.play();
}
function next(auto){
  if(!S.queue.length)return;
  if(S.shuffle&&S.queue.length>1){let r;do{r=Math.floor(Math.random()*S.queue.length)}while(r===S.qi);return startAt(r)}
  if(S.qi+1<S.queue.length)return startAt(S.qi+1);
  if(!auto||S.repeat==='all')return startAt(0);
  S.playing=false;setPlayUI();
}
function prev(){
  if(!S.queue.length)return;
  if(eng.time()>3){eng.seek(0);return}
  startAt(S.qi-1);
}
function onEnded(){
  if(S.repeat==='one'){eng.seek(0);eng.play();return}
  next(true);
}

  if('mediaSession' in navigator){

  }

function setAccent(t){
  if(t.color){document.documentElement.style.setProperty('--accent',t.color);return}
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{
    try{
      const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(img,0,0,16,16);
      const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,n=0;
      for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];n++}
      r=r/n*.62;g=g/n*.62;b=b/n*.62;
      t.color=`rgb(${r|0},${g|0},${b|0})`;
      if(S.cur===t)document.documentElement.style.setProperty('--accent',t.color);
    }catch(_){document.documentElement.style.setProperty('--accent',`hsl(${hue(t.key)},30%,22%)`)}
  };
  img.onerror=()=>document.documentElement.style.setProperty('--accent',`hsl(${hue(t.key)},30%,22%)`);
  img.src=t.cover;
}

/* ============================================================
   LYRICS (LRCLIB) — sinkron per baris jika tersedia
============================================================ */
let lyTok=0;
const cleanT=s=>String(s||'').replace(/\([^)]*\)/g,'').replace(/\[[^\]]*\]/g,'').replace(/\s+-\s+.*$/,'').replace(/\b(feat\.|ft\.|featuring)\b.*$/i,'').trim();
function parseLrc(s){
  const out=[];
  for(const ln of String(s||'').split('\n')){
    const m=ln.match(/^\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\](.*)$/);
    if(m){const tx=m[4].trim();if(tx)out.push({time:(+m[1])*60+(+m[2])+(m[3]?+m[3].padEnd(3,'0')/1000:0),text:tx})}
  }
  return out;
}
async function fetchLyrics(t){
  const box=$('#lyrics'),badge=$('#lyBadge'),tk=++lyTok;
  S.ly={lines:[],synced:false,active:-1};
  box.innerHTML='<p class="lyMsg">Mencari lirik…</p>';badge.textContent='…';
  const title=cleanT(t.title),artist=cleanT(String(t.artist).split(',')[0]);
  const tj=async u=>{try{const r=await fetch(u);if(!r.ok)return null;return await r.json()}catch(_){return null}};
  let rec=null;
  const dur=t.duration?`&duration=${Math.round(t.duration)}`:'';
  let d=await tj(`https://lrclib.net/api/get?artist_name=${enc(artist)}&track_name=${enc(title)}${dur}`);
  if(d&&(d.syncedLyrics||d.plainLyrics))rec=d;
  if(!rec){const a=await tj(`https://lrclib.net/api/search?track_name=${enc(title)}&artist_name=${enc(artist)}`);if(Array.isArray(a))rec=a.find(x=>x.syncedLyrics)||a.find(x=>x.plainLyrics)||null}
  if(!rec){const a=await tj(`https://lrclib.net/api/search?q=${enc(title+' '+artist)}`);if(Array.isArray(a))rec=a.find(x=>x.syncedLyrics)||a.find(x=>x.plainLyrics)||null}
  if(tk!==lyTok)return;
  if(rec&&rec.syncedLyrics){
    const lines=parseLrc(rec.syncedLyrics);
    if(lines.length){
      S.ly={lines,synced:true,active:-1};badge.textContent='Sinkron';
      box.innerHTML=lines.map((l,i)=>`<p class="ly" id="ly${i}" data-act="lySeek" data-t="${l.time}">${esc(l.text)}</p>`).join('');
      syncLyrics(eng.time());return;
    }
  }
  if(rec&&rec.plainLyrics){
    badge.textContent='Teks';
    box.innerHTML=String(rec.plainLyrics).split('\n').map(l=>l.trim()?`<p class="ly plain">${esc(l)}</p>`:'<div style="height:10px"></div>').join('');return;
  }
  badge.textContent='Tidak ada';
  box.innerHTML=`<p class="lyMsg">Lirik "${esc(title)}" belum tersedia.</p>`;
}
function syncLyrics(sec){
  if(!S.ly.synced)return;
  const L=S.ly.lines;let idx=-1;
  for(let i=0;i<L.length;i++){if(L[i].time<=sec+0.15)idx=i;else break}
  if(idx===S.ly.active)return;
  S.ly.active=idx;
  const box=$('#lyrics');
  box.querySelectorAll('.ly').forEach((el,i)=>{
    el.classList.toggle('now',i===idx);el.classList.toggle('past',i<idx);
    if(i===idx&&$('#player').classList.contains('open'))box.scrollTo({top:Math.max(0,el.offsetTop-box.clientHeight/2+el.clientHeight/2),behavior:'smooth'});
  });
}

async function fjson(u,ms=7000){const c=new AbortController();const to=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});return r.ok?await r.json():null}catch(_){return null}finally{clearTimeout(to)}}
async function artistPic(n){
  const d=await jsonp(`https://api.deezer.com/search/artist?q=${enc(n)}&limit=1`,6000);
  const a=d&&d.data&&d.data[0];
  if(a&&(a.picture_xl||a.picture_big)&&nrm(a.name).replace(/_/g,'').includes(nrm(n).replace(/_/g,'').slice(0,5)))return a.picture_xl||a.picture_big;
  const j=await fjson(`https://www.theaudiodb.com/api/v1/json/2/search.php?s=${enc(n)}`);
  const x=j&&j.artists&&j.artists[0];
  if(x&&(x.strArtistThumb||x.strArtistClearart))return x.strArtistThumb||x.strArtistClearart;
  for(const lang of ['en','id']){
    const w=await fjson(`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${enc(n+' musician')}&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=500&format=json&origin=*`);
    const pg=w&&w.query&&Object.values(w.query.pages)[0];
    if(pg&&pg.thumbnail&&pg.thumbnail.source)return pg.thumbnail.source;
  }
  const it=await fjson(`https://itunes.apple.com/search?term=${enc(n)}&media=music&entity=song&attribute=artistTerm&limit=1&country=ID`);
  const r=it&&it.results&&it.results[0];
  if(r&&r.artworkUrl100)return r.artworkUrl100.replace(/\d+x\d+bb/,'600x600bb');
  return '';
}
async function loadArtPics(){

  if(loadArtPics.busy)return;loadArtPics.busy=true;
  let i=0;
  const worker=async()=>{while(i<names.length){const n=names[i++];const u=await artistPic(n);if(u){artPics[n]=u;store.set('sba_art2',artPics);applyArtPics()}}};

}

function renderListPage(listId){
  const tracks=getList(listId);tracks.slice(0,16).forEach(t=>ensureMeta(t));let name=listName(listId),desc='',c='#3a3a5a',cover='',sub='';
  if(listId.startsWith('pl:')){const p=PL[listId.slice(3)];desc=p.desc;c=p.c1;cover=plCover(p);sub=`${tracks.length} lagu`}
  else if(listId==='fav'){c='#4a2fb0';cover='data:image/svg+xml;utf8,'+enc('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4500e2"/><stop offset="1" stop-color="#a79df0"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><path d="M50 74 45 69C28 54 18 45 18 34c0-8 6-14 14-14 5 0 10 3 13 7h10c3-4 8-7 13-7 8 0 14 6 14 14 0 11-10 20-27 35z" fill="#fff"/></svg>');sub=`${tracks.length} lagu`}
  else if(listId.startsWith('up:')){c='#2a4a6a';cover=tracks[0]?coverOf(tracks[0]):genCover(name,name);sub=`${tracks.length} lagu`}
  else{cover=genCover(name,name);sub=`${tracks.length} lagu`}
  $('#view').innerHTML=`
  <div class="plHead" style="--hc:${c}">
    <button class="back" data-act="back">${IC.left}</button>
    ${listId.startsWith('pl:')?plArt(PL[listId.slice(3)],'plCover'):`<img class="plCover" src="${cover}" alt="">`}
    <div class="plTitle">${esc(name)}</div>
    ${desc?`<div class="plDesc">${esc(desc)}</div>`:''}
    <div class="plMeta"><span class="avatar">A</span><b style="color:#fff">Alex</b><span>• ${sub}</span></div>
    <div class="plCtl">
      <button class="ic" style="width:28px;height:28px" data-act="shuffle">${IC.shuffle}</button>
      <button class="ic" style="width:28px;height:28px">${IC.dotsH}</button>
      <div class="sp"></div>
      <button class="bigPlay" data-act="playAll" data-list="${listId}">${S.shuffle?IC.play:IC.play}</button>
    </div>
  </div>
  <div>${tracks.length?tracks.map((t,i)=>rowHtml(t,listId,i)).join(''):'<div class="msg">Belum ada lagu di sini.</div>'}</div>`;
  $('.bigPlay svg').style.cssText='width:28px;height:28px';
  const sh=document.querySelector('.plCtl .ic');if(sh)sh.classList.toggle('on',S.shuffle);
}

let sT=null;
function renderSearch(){
  const q=S.search.q;
  const tiles=PLAYLISTS.map(p=>`<button class="gTile" style="background:${p.c1}" data-act="openPl" data-id="${p.id}">${esc(p.name.replace(' — Terbaik','').replace('lagu ','').slice(0,34))}<img src="${plCover(p)}" alt=""></button>`).join('');
  $('#view').innerHTML=`
  <div class="hTitle">Cari</div>
  <div class="sbox">${IC.search.replace('<svg','<svg class="s"')}<input id="sIn" type="search" placeholder="Apa yang ingin kamu dengarkan?" value="${esc(q)}" autocomplete="off">${q?'<button data-act="clearSearch">✕</button>':''}</div>
  <div id="sRes" style="padding-top:14px"></div>`;
  updateSearchRes();
  const inp=$('#sIn');
  inp.addEventListener('input',e=>{
    S.search.q=e.target.value;clearTimeout(sT);
    const bx=$('.sbox button');if(!bx&&S.search.q)$('.sbox').insertAdjacentHTML('beforeend','<button data-act="clearSearch">✕</button>');
    if(!S.search.q.trim()){S.search.res=[];S.search.artists=[];S.search.feed=newFeed();S.search.busy=false;updateSearchRes();return}
    S.search.artists=[];
    S.search.feed=newFeed();localSearch();S.search.busy=true;updateSearchRes();
    sT=setTimeout(remoteSearch,650);
  });
  S._tiles=tiles;
}
function newFeed(){return {seen:new Set(),dz:[],names:[],started:false,loading:false,done:false,start:-1,seeds:[]}}
function updateSearchRes(){
  const el=$('#sRes');if(!el)return;
  const q=S.search.q.trim();
  if(!q){
    const tiles=PLAYLISTS.map(p=>`<button class="gTile" style="background:${p.c1}" data-act="openPl" data-id="${p.id}">${esc(p.name.replace(' — Terbaik','').replace('lagu ','').slice(0,34))}<img src="${plCover(p)}" alt=""></button>`).join('');
    el.innerHTML=`<h2 class="sec" style="padding-top:6px">Jelajahi semua</h2><div class="gGrid">${tiles}</div>`;return;
  }
  const f=S.search.feed,r=S.search.res,ar=S.search.artists||[];
  const split=f.start>=0?f.start:r.length;

function appendFeed(list){

let sentIO=null;
function watchSentinel(){
  const s=$('#feedSent');if(!s||!('IntersectionObserver' in window))return;
  if(sentIO)sentIO.disconnect();
  sentIO=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))loadFeed()},{root:$('#view'),rootMargin:'900px'});

const mapDzTrack=x=>{const t=reg({title:(x.title_short||x.title),artist:x.artist.name,album:(x.album&&x.album.title)||'',cover:(x.album&&(x.album.cover_xl||x.album.cover_big))||'',duration:x.duration||0});if(x.preview&&!t.preview)t.preview=x.preview;return t};
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function feedBatch(){
  const f=S.search.feed;
  while(f.dz.length){
    const id=f.dz.shift();if(f.seen.has('d'+id))continue;f.seen.add('d'+id);
    const [top,rel]=await Promise.all([jsonp(`https://api.deezer.com/artist/${id}/top?limit=40`),jsonp(`https://api.deezer.com/artist/${id}/related?limit=12`)]);
    (rel&&rel.data||[]).forEach(a=>{if(!f.seen.has('d'+a.id)&&!f.dz.includes(a.id))f.dz.push(a.id)});
    const l=(top&&top.data||[]).filter(x=>x.title&&x.artist).map(mapDzTrack);
    if(l.length)return l;
  }
  // fallback: iTunes dari artis seleramu / hasil pencarian
  if(!f.names.length)f.names=shuffled([...ARTISTS_INDO,...ARTISTS_WEST,...ARTISTS_INDO_REC,...ARTISTS_WEST_REC].filter(n=>!f.seen.has('n'+n)));
  while(f.names.length){
    const n=f.names.shift();f.seen.add('n'+n);
    const j=await fjson(`https://itunes.apple.com/search?term=${enc(n)}&media=music&entity=song&attribute=artistTerm&limit=40&country=ID`);
    const l=(j&&j.results||[]).filter(x=>x.trackName&&x.artistName).map(x=>reg({title:x.trackName.replace(/\s*\((feat|with)[^)]*\)/i,''),artist:x.artistName,album:x.collectionName||'',cover:(x.artworkUrl100||'').replace(/\d+x\d+bb/,'600x600bb'),duration:Math.round((x.trackTimeMillis||0)/1000)}));
    if(l.length)return l;
  }
  return [];
}
async function loadFeed(){
  const f=S.search.feed,mine=S.search.q.trim();
  if(f.loading||S.search.busy||!mine)return;
  f.loading=true;
  try{
    let add=[],guard=0;
    const kf=t=>coreTitle(t.title)+'|'+nrm(String(t.artist).split(',')[0]);
    const seen=new Set(S.search.res.map(kf));
    while(add.length<18&&guard++<6){
      const b=await feedBatch();
      if(S.search.q.trim()!==mine)return;
      if(!b.length){f.names=[];f.seen=new Set([...f.seen].filter(x=>x[0]==='d'));if(guard>3)break;continue}
      for(const t of shuffled(b)){const k=kf(t);if(seen.has(k))continue;seen.add(k);add.push(t)}
    }
    if(S.search.q.trim()!==mine)return;
    if(add.length)appendFeed(add);else{const s0=$('#feedSent');if(s0)s0.innerHTML='<div class="msg" style="padding:10px">Coba kata kunci lain untuk rekomendasi baru</div>'}
  }finally{f.loading=false}
  const s=$('#feedSent');if(s&&sentIO){sentIO.unobserve(s);sentIO.observe(s)}
}
function addSearchTracks(mine,list){
  if(S.search.q.trim()!==mine||S.search.feed.start>=0)return;
  const kf=t=>coreTitle(t.title)+'|'+nrm(String(t.artist).split(',')[0]);
  const seen=new Set(S.search.res.map(kf));
  for(const t of list){const k=kf(t);if(seen.has(k))continue;seen.add(k);S.search.res.push(t)}
  if(S.search.res.length>500)S.search.res.length=500;
  if(S.tab==='search'&&!S.page.search)updateSearchRes();
}
function localSearch(){

  S.search.res=out.slice(0,80);
}
const ytSQ=store.get('sba_ysq',{});
async function ytSearchFull(q){
  if(!S.ytKey)return [];
  const k=q.toLowerCase();
  let items=ytSQ[k];
  if(!items){
    const j=await fj(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=25&q=${enc(q)}&key=${enc(S.ytKey)}`);
    if(!j||!Array.isArray(j.items))return [];
    const ids=j.items.map(i=>i.id&&i.id.videoId).filter(Boolean).join(',');
    const d=ids?await fj(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${ids}&key=${enc(S.ytKey)}`):null;
    const dur={};(d&&d.items||[]).forEach(v=>dur[v.id]=isoDur(v.contentDetails.duration));
    items=j.items.filter(i=>i.id&&i.id.videoId&&dur[i.id.videoId]>45&&dur[i.id.videoId]<=900).map(i=>({id:i.id.videoId,t:i.snippet.title,c:i.snippet.channelTitle,d:dur[i.id.videoId],img:(i.snippet.thumbnails.high||i.snippet.thumbnails.medium||i.snippet.thumbnails.default||{}).url||''}));
    const ks=Object.keys(ytSQ);if(ks.length>40)delete ytSQ[ks[0]];
    ytSQ[k]=items;store.set('sba_ysq',ytSQ);
  }
  const clean=s=>String(s).replace(/\s*[\(\[](official|lyric|lyrics|audio|video|music video|mv|full|hd|visualizer)[^\)\]]*[\)\]]/ig,'').replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"').trim();
  return items.map(x=>{
    const key='yt_'+x.id;
    let title=clean(x.t),artist=String(x.c).replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/i,'').trim();
    const m=title.match(/^(.{2,40}?)\s[-–]\s(.{2,})$/);if(m&&/official|topic|vevo/i.test(x.c)===false&&m[1].length<=40){artist=m[1];title=m[2]}
    const t=reg({key,title,artist,cover:x.img,duration:x.d});
    t.fromYt=true;ytCache[key]=[x.id];return t;
  });
}
async function remoteSearch(){
  const q=S.search.q.trim();if(!q)return;const mine=q;
  S.search.feed=newFeed();
  const mapIt=x=>reg({title:x.trackName.replace(/\s*\((feat|with)[^)]*\)/i,''),artist:x.artistName,album:x.collectionName||'',cover:(x.artworkUrl100||'').replace(/\d+x\d+bb/,'600x600bb'),duration:Math.round((x.trackTimeMillis||0)/1000)});
  const it=(cc,extra)=>fetch(`https://itunes.apple.com/search?term=${enc(q)}&media=music&entity=song&limit=50&country=${cc}${extra||''}`).then(r=>r.ok?r.json():null).catch(()=>null).then(j=>{if(j)addSearchTracks(mine,(j.results||[]).filter(x=>x.trackName&&x.artistName).map(mapIt))});
  const dz=idx=>jsonp(`https://api.deezer.com/search?q=${enc(q)}&limit=100&index=${idx}`).then(d=>{if(d&&d.data){d.data.slice(0,6).forEach(x=>{if(x.artist&&x.artist.id&&!S.search.feed.dz.includes(x.artist.id)&&S.search.feed.dz.length<4)S.search.feed.dz.push(x.artist.id)});addSearchTracks(mine,d.data.filter(x=>x.title&&x.artist).map(mapDzTrack))}});
  const au=fetch(`${AUDIUS[0]}/v1/tracks/search?query=${enc(q)}&limit=25&app_name=SpotifyByAlex`).then(r=>r.ok?r.json():null).catch(()=>null).then(j=>{if(j&&Array.isArray(j.data))addSearchTracks(mine,j.data.filter(x=>x&&x.id&&x.duration>60&&x.is_streamable!==false).map(x=>{const t=reg({key:'au_'+x.id,title:x.title,artist:(x.user&&x.user.name)||'Audius',cover:(x.artwork&&(x.artwork['480x480']||x.artwork['150x150']))||'',duration:x.duration});t._aud={id:String(x.id),h:0};audCache['au_'+x.id]=t._aud;return t}))});
  const yt=ytSearchFull(q).then(l=>addSearchTracks(mine,l));
  const art=jsonp(`https://api.deezer.com/search/artist?q=${enc(q)}&limit=8`).then(d=>{if(S.search.q.trim()!==mine)return;const arr=(d&&d.data||[]);arr.slice(0,3).forEach(a=>{if(!S.search.feed.dz.includes(a.id))S.search.feed.dz.unshift(a.id)});S.search.artists=arr.map(a=>({name:a.name,pic:a.picture_big||a.picture_medium||''}));updateSearchRes()});
  await Promise.all([it('ID'),it('ID','&attribute=artistTerm'),it('US'),it('US','&attribute=artistTerm'),dz(0),dz(100),dz(200),au,yt,art]);
  if(S.search.q.trim()===mine){S.search.busy=false;updateSearchRes()}
}

  skipNext(){closeSheet();S.fails=0;next(false)},
  saveKey(){S.ytKey=($('#keyIn').value||'').trim();store.set('sba_ytkey2',S.ytKey);ytCache={};store.set('sba_yt4',{});closeSheet();toast('Key tersimpan')},
  async testYt(){
    const o=$('#testOut');o.textContent='Menguji…';
    const j=await fj(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&q=tulus+monokrom&key=${enc(S.ytKey)}`);
    o.textContent=j&&j.items?'Key YouTube OK ✓':'Gagal: '+(lastYtErr||'tidak diketahui');
  },
  clearCache(){metaCache={};audCache={};ytCache={};store.set('sba_yt4',{});store.set('sba_meta4',{});store.set('sba_aud2',{});closeSheet();toast('Cache dihapus')},
  pickFiles(){$('#fileIn').click()},
  sheetBg(el,e){if(e.target===el)closeSheet()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=H[el.dataset.act];if(f){f(el,e)}
});
$('#fileIn').addEventListener('change',e=>{
  const files=[...(e.target.files||[])];if(!files.length)return;
  const added=files.map((f,i)=>{
    const title=f.name.replace(/\.[^/.]+$/,'');
    const t=reg({key:'local_'+Date.now()+'_'+i,title,artist:'File dari HP',album:'Penyimpanan lokal',local:true,url:URL.createObjectURL(f)});
    t.local=true;t.url=t.url||URL.createObjectURL(f);t.metaDone=true;
    const a=new Audio();a.preload='metadata';a.src=t.url;a.onloadedmetadata=()=>{t.duration=Math.round(a.duration)||0;document.querySelectorAll(`[data-du="${t.key}"]`).forEach(x=>x.textContent=fmt(t.duration))};
    return t;
  });
  S.local=[...added,...S.local];S.libTab='local';S.tab='library';S.page.library=null;render();
  playList('local',0);toast(`${added.length} file dimuat`);
  e.target.value='';
});

document.addEventListener('error',e=>{const i=e.target;if(i&&i.tagName==='IMG'&&i.dataset&&i.dataset.cv){const t=TRACKS.get(i.dataset.cv);if(t){t.cover='';delete metaCache[t.key];i.src=genCover(t.key,t.title)}}},true);

$('#bShare').innerHTML=IC.share;$('#bQueue').innerHTML=IC.queue;
$('#bPlay').innerHTML=IC.play;$('#bPlay').firstElementChild.style.cssText+=';width:30px;height:30px';
$('#miniPlay').innerHTML=IC.play;$('#miniPlay').firstElementChild.style.cssText+=';width:26px;height:26px';

render();
